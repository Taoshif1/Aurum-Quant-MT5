name: Portable logic regressions and source package (not MT5 compilation)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate patch whitespace
        run: git diff --check HEAD^1 HEAD
      - name: Compile production-header tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -I Tests/portable -I Include Tests/portable/regression.cpp -o /tmp/aurum-regression
      - name: Run deterministic regressions
        run: /tmp/aurum-regression
      - name: Verify preset safety and inputs
        run: python3 tools/check-presets.py
      - name: Audit release metadata and safety claims
        run: python3 tools/release-audit.py
      - name: Self-test native evidence verifier
        run: python3 tools/check-native-evidence.py --self-test
      - name: Build deterministic source release
        run: python3 tools/build-source-release.py
      - name: Verify source release
        run: python3 tools/check-source-release.py
      - name: Verify reproducible source ZIP
        shell: bash
        run: |
          before="$(sha256sum dist/AurumQuant-MT5-source-v*.zip)"
          python3 tools/build-source-release.py
          after="$(sha256sum dist/AurumQuant-MT5-source-v*.zip)"
          test "$before" = "$after"
      - name: Upload research source artifact
        uses: actions/upload-artifact@v7
        with:
          name: aurum-quant-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
